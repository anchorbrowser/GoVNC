version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - errcheck
        text: Error return value of `[^`]*\.(Close|CloseNow)` is not checked

formatters:
  enable:
    - gofmt
